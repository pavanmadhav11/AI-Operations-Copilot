databases:
  - name: ai-operations-copilot-db
    databaseName: ai_copilot
    user: ai_copilot_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: ai-operations-copilot-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: AI Operations Copilot
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DATABASE_URL
        fromDatabase:
          name: ai-operations-copilot-db
          property: connectionString
      - key: PRESENTATION_PASSWORD
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://ai-operations-copilot-web.onrender.com
      - key: SEED_PRESENTATION_DATA
        value: true

  - type: web
    name: ai-operations-copilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-operations-copilot-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
